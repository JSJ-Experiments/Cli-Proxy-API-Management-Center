name: Blacksmith dashboard build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build single-file dashboard
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always --dirty)"
          VERSION="$VERSION" bun run build
          mv dist/index.html dist/management.html
          (cd dist && sha256sum management.html > management.html.sha256)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-proxy-management-html
          path: |
            dist/management.html
            dist/management.html.sha256
          retention-days: 30
